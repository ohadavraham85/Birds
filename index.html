<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="description" content="מערכת offline-first לניהול ותיעוד תצפיות צפרות, עם סנכרון לשרת כשחוזרת התקשורת">
  <title>יומן צפרות</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script>
    try {
      var t = localStorage.getItem('birds-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo" aria-hidden="true">🦉</span>
      <h1>יומן צפרות</h1>
    </div>
    <div class="topbar-actions">
      <span id="sync-pill" class="sync-pill" hidden></span>
      <span id="net-status" class="net-status" title="מצב חיבור"></span>
      <div class="topbar-menu">
        <button id="nav-action" class="topbar-btn" title="תפריט" aria-label="תפריט">⋯</button>
        <div class="topbar-menu-list" id="topbar-menu-list" hidden>
          <button data-view="table">📋 רשימה</button>
          <button data-view="settings">⚙️ הגדרות</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="view-form" class="view" hidden></section>
    <section id="view-map" class="view view-flush" hidden></section>
    <section id="view-table" class="view" hidden></section>
    <section id="view-cards" class="view" hidden></section>
    <section id="view-detail" class="view" hidden></section>
    <section id="view-species" class="view" hidden></section>
    <section id="view-calendar" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <button id="fab" class="fab" title="הוספת תצפית" aria-label="הוספת תצפית" hidden>➕</button>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <button data-view="cards" class="tab"><span class="tab-icon">🔭</span><span>יומן</span></button>
    <button data-view="calendar" class="tab"><span class="tab-icon">📅</span><span>לוח שנה</span></button>
    <button data-view="map" class="tab"><span class="tab-icon">🗺️</span><span>מפה</span></button>
    <button data-view="species" class="tab"><span class="tab-icon">🐦</span><span>מינים</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
