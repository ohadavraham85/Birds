<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="description" content="מערכת לניהול ותיעוד תצפיות צפרות — POC בקליינט בלבד, עובדת בשטח גם ללא רשת">
  <title>יומן צפרות</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo" aria-hidden="true">🦉</span>
      <h1>יומן צפרות</h1>
    </div>
    <div class="topbar-actions">
      <span class="badge" style="background:rgba(255,255,255,.18);color:#fff">POC</span>
      <span id="net-status" class="net-status" title="מצב חיבור"></span>
    </div>
  </header>

  <main id="main">
    <section id="view-form" class="view" hidden></section>
    <section id="view-map" class="view view-flush" hidden></section>
    <section id="view-table" class="view" hidden></section>
    <section id="view-cards" class="view" hidden></section>
    <section id="view-species" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <button data-view="form" class="tab"><span class="tab-icon">📝</span><span>טופס</span></button>
    <button data-view="map" class="tab"><span class="tab-icon">🗺️</span><span>מפה</span></button>
    <button data-view="table" class="tab"><span class="tab-icon">📋</span><span>רשימה</span></button>
    <button data-view="cards" class="tab"><span class="tab-icon">🗂️</span><span>יומן</span></button>
    <button data-view="species" class="tab"><span class="tab-icon">🐦</span><span>מינים</span></button>
    <button data-view="settings" class="tab"><span class="tab-icon">⚙️</span><span>הגדרות</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/html2pdf/html2pdf.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
