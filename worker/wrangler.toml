# Cloudflare Worker config for the birds sync backend.
# Deployed automatically by .github/workflows/deploy-worker.yml
name = "birds-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# --- D1 database (structured records) ---
[[d1_databases]]
binding = "DB"
database_name = "birds"
database_id = "086bd825-e189-48d8-8e71-526b42c111d1"

# --- R2 bucket (photos) ---
# Bucket "birds-photos" created in the Cloudflare dashboard.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "birds-photos"

# SYNC_TOKEN is set as an encrypted secret (not here) by the deploy workflow.
