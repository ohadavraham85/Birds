# Cloudflare Worker config for the birds sync backend.
# Deployed automatically by .github/workflows/deploy-worker.yml
name = "birds-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# --- D1 database (structured records) ---
# Create it once in the Cloudflare dashboard (Storage & Databases → D1 → Create,
# name it "birds") and paste its Database ID below.
[[d1_databases]]
binding = "DB"
database_name = "birds"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# --- R2 bucket (photos) ---
# Create it once in the dashboard (R2 → Create bucket → name "birds-photos").
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "birds-photos"

# SYNC_TOKEN is set as an encrypted secret (not here) by the deploy workflow.
