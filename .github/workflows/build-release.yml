name: Build & Release

on:
  push:
    branches: [claude/bird-observation-pwa-kqedtw, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify JavaScript syntax
        run: |
          set -e
          for f in $(find js sw.js -name '*.js'); do
            node --check "$f"
            echo "OK $f"
          done

      - name: Compute next version
        id: ver
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: v$next (previous: ${latest:-none})"

      - name: Build package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist/birds-app
          rsync -a --exclude dist --exclude .git --exclude .github ./ dist/birds-app/
          # stamp the version into the app
          echo "{\"version\": \"$VER\", \"builtAt\": \"$(date -u +%FT%TZ)\", \"commit\": \"$GITHUB_SHA\"}" > dist/birds-app/version.json
          # bust the service-worker cache so installed clients pick up the new version
          sed -i "s/const CACHE = 'birds-app-v[^']*'/const CACHE = 'birds-app-v$VER'/" dist/birds-app/sw.js
          grep "const CACHE" dist/birds-app/sw.js
          cd dist
          zip -qr "birds-app-v$VER.zip" birds-app
          ls -la *.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: birds-app-v${{ steps.ver.outputs.version }}
          path: dist/birds-app

      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VER"
          git push origin "v$VER"
          NOTES=$(printf 'בנייה אוטומטית מ-commit %s.\n\n**התקנה:** מחלצים את ה-ZIP ומעלים לכל אחסון סטטי עם HTTPS (GitHub Pages / Netlify / Cloudflare Pages), או מריצים מקומית עם `npx http-server`.' "${GITHUB_SHA::7}")
          gh release create "v$VER" "dist/birds-app-v$VER.zip" \
            --title "יומן צפרות v$VER" \
            --notes "$NOTES"

  # פרסום ל-GitHub Pages — האפליקציה זמינה להתקנה כ-PWA בטלפון
  deploy-pages:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: birds-app-v${{ needs.build-release.outputs.version }}
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
