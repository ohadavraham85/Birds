name: Build & Release

on:
  push:
    branches: [claude/electrical-assets-map-app-6k27ot, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Compute next version
        id: ver
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: v$next (previous: ${latest:-none})"

      - name: Build (Vite + PWA)
        env:
          GITHUB_PAGES: '1'
        run: npx vite build

      - name: Stamp version + package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          echo "{\"version\": \"$VER\", \"builtAt\": \"$(date -u +%FT%TZ)\", \"commit\": \"$GITHUB_SHA\"}" > dist/version.json
          cd dist
          zip -qr "../electric-assets-map-v$VER.zip" .
          ls -la ../*.zip

      - name: Upload Pages build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VER"
          git push origin "v$VER"
          NOTES=$(printf 'בנייה אוטומטית (Vite + TypeScript, PWA offline-first) מ-commit %s.\n\nהאפליקציה מותקנת מ-GitHub Pages; ה-ZIP הוא ה-build הסטטי (dist) לפריסה בכל אחסון סטטי עם HTTPS.' "${GITHUB_SHA::7}")
          gh release create "v$VER" "electric-assets-map-v$VER.zip" \
            --title "ניהול נכסי חשמל v$VER" \
            --notes "$NOTES"

  deploy-pages:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
