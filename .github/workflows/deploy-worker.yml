name: Deploy Sync Worker

on:
  push:
    branches: [claude/bird-observation-pwa-kqedtw, main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare is configured
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet — skipping deploy (add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        if: steps.check.outputs.configured == 'true'
        run: npm install

      - name: Apply D1 schema
        if: steps.check.outputs.configured == 'true'
        run: npx wrangler d1 execute birds --remote --file=schema.sql --yes

      - name: Deploy Worker
        if: steps.check.outputs.configured == 'true'
        run: npx wrangler deploy

      - name: Set SYNC_TOKEN secret
        if: steps.check.outputs.configured == 'true'
        run: printf '%s' "${{ secrets.SYNC_TOKEN }}" | npx wrangler secret put SYNC_TOKEN
